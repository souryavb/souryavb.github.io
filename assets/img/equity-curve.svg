<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Price chart with RSI oscillator below, showing oversold buy signals and overbought sell signals">
  <style>
    .grid  { stroke: #d4d1ca; stroke-width: 1.5; }
    .band  { stroke: #bcb8b0; stroke-width: 1.5; stroke-dasharray: 6 6; }
    .line  { fill: none; stroke: #186b45; stroke-width: 3.5; stroke-linejoin: round; stroke-linecap: round; }
    .rsi   { fill: none; stroke: #65635e; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .buy   { fill: #358e61; }
    .sell  { fill: #151412; }
    .label { fill: #65635e; font: 600 20px 'Instrument Sans', system-ui, sans-serif; }
    .title { fill: #151412; font: 800 24px 'Instrument Sans', system-ui, sans-serif; letter-spacing: -0.02em; }
  </style>

  <rect width="800" height="800" fill="none"/>

  <!-- Price panel -->
  <text class="title" x="60" y="40">^GSPC</text>
  <g class="grid">
    <line x1="60" y1="60"  x2="760" y2="60"/>
    <line x1="60" y1="160" x2="760" y2="160"/>
    <line x1="60" y1="260" x2="760" y2="260"/>
    <line x1="60" y1="360" x2="760" y2="360"/>
    <line x1="60" y1="450" x2="760" y2="450"/>
  </g>
  <polyline class="line" points="60,380 100,360 140,395 180,340 220,355 260,300 300,330 340,280 380,310 420,250 460,290 500,230 540,265 580,200 620,240 660,175 700,205 740,140"/>

  <!-- Entries (RSI oversold) and exits (RSI overbought) -->
  <g class="buy">
    <circle cx="140" cy="395" r="9"/>
    <circle cx="620" cy="240" r="9"/>
  </g>
  <g class="sell">
    <circle cx="260" cy="300" r="9"/>
    <circle cx="420" cy="250" r="9"/>
    <circle cx="580" cy="200" r="9"/>
  </g>

  <!-- RSI panel -->
  <text class="title" x="60" y="505">RSI(14)</text>
  <g class="grid">
    <line x1="60" y1="520" x2="760" y2="520"/>
    <line x1="60" y1="760" x2="760" y2="760"/>
  </g>
  <g class="band">
    <line x1="60" y1="592" x2="760" y2="592"/>
    <line x1="60" y1="688" x2="760" y2="688"/>
  </g>
  <text class="label" x="770" y="598" text-anchor="end" dx="-4">70</text>
  <text class="label" x="770" y="694" text-anchor="end" dx="-4">30</text>
  <polyline class="rsi" points="60,652 100,611 140,693 180,592 220,664 260,580 300,676 340,587 380,669 420,578 460,681 500,597 540,659 580,582 620,688 660,590 700,652 740,602"/>
</svg>
